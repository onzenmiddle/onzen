<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ONZEN</title>
  <style>
    /* 기본 스타일 리셋 */
    html, body { 
      margin: 0; 
      padding: 0; 
      background-color: #ffffff;
    }

    /* [핵심 수정] 전체 화면을 완전히 감싸서 밝기와 글자 크기를 강제로 조절하는 레이어 */
    #theme-wrapper {
      font-family: 'Noto Sans KR', sans-serif;
      min-height: 100vh;
      background-color: #ffffff;
      color: #333;
      /* 밝기 조절과 글자 크기 조절이 이 wrapper 전체에 완벽히 먹히도록 설정 */
      transition: filter 0.2s ease, font-size 0.2s ease;
    }
    
    header { display: flex; justify-content: space-between; align-items: center; padding: 20px; border-bottom: 1px solid #eee; }
    h1 { margin: 0; font-size: 24px; letter-spacing: 2px; }
    .gear-btn { background: none; border: none; font-size: 24px; cursor: pointer; }
    
    /* 설정 모달창 (여기는 밝기/글자 크기 조절의 영향을 받지 않도록 글자 크기 고정) */
    #settingsModal { display: none; position: absolute; top: 70px; right: 20px; background: #fff; border: 1px solid #ddd; padding: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 200px; z-index: 1
