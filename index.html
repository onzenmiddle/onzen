<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ONZEN</title>
  
  <script>
    window.onerror = function(message, source, lineno, colno, error) {
      alert("코드 실행 중 오류 발생!\n글자나 기호가 잘렸는지 확인해보세요.\n\n에러내용: " + message + "\n줄 위치: " + lineno);
      return false;
    };
  </script>

  <style>
    /* 기본 스타일 리셋 */
    html, body { 
      margin: 0; 
      padding: 0; 
      background-color: #ffffff;
      width: 100%;
    }

    /* 전체 화면을 감싸서 밝기와 글자 크기를 조절하는 레이어 */
    #theme-wrapper {
      font-family: 'Noto Sans KR', sans-serif;
      min-height: 100vh;
      width: 100%;
      background-color: #ffffff;
      color: #333;
      transition: filter 0.2s ease, font-size 0.2s ease;
      box-sizing: border-box;
    }
    
    header { display: flex; justify-content: space-between; align-items: center; padding: 20px; border-bottom: 1px solid #eee; }
    h1 { margin: 0; font-size: 24px; letter-spacing: 2px; }
    .gear-btn { background: none; border: none; font-size: 24px; cursor: pointer; }
    
    /* 설정 모달창 */
    #settingsModal { display: none; position: absolute; top: 70px; right: 20px; background: #fff; border: 1px solid #ddd; padding: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 200px; z-index: 100; font-size: 14px !important; }
    .setting-item { margin-bottom: 15px; }
    .setting-item label { display: block; margin-bottom: 5px; font-weight: bold; }
    .admin-login { margin-top: 15px; font-size: 12px; border-top: 1px solid #eee; padding-top: 10px; }
    .admin-login input { width: 100%; margin-bottom: 5px; box-sizing: border-box; padding: 5px; }
    
    /* 메뉴 및 콘텐츠 */
    nav { display: flex; gap: 15px; padding: 20px; border-bottom: 1px solid #eee; }
    nav button { background: none; border: none; font-size: 16px; font-weight: bold; cursor: pointer; color: #888; padding: 5px 10px; }
    nav button.active { color: #000; border-bottom: 2px solid #000; }
    main, article { padding: 20px; }
    
    /* 정렬 내비게이션 */
    .sort-nav { display: flex; gap: 15px; padding: 0 20px; margin-top: 15px; font-size: 13px; }
    .sort-nav button { background: none; border: none; cursor: pointer; color: #888; padding: 0; font-size: 13px; }
    .sort-nav button.active { color: #000; font-weight: bold; }

    /* 게시글 목록 디자인 */
    .post-item-wrapper { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f5f5f5; padding: 15px 0; }
    .post-item { cursor: pointer; flex-grow: 1; }
    .post-item h2 { margin: 5px 0 0 0; font-size: 18px; font-weight: 500; }
    .post-info { display: flex; gap: 10px; font-size: 11px; color: #888; margin-top: 4px; }
    .post-category { color: #ff4a5a; font-weight: bold; letter-spacing: 1px; }
    
    /* 삭제 버튼 */
    .delete-btn { background: #ff4a5a; color: white; border: none; padding: 5px 10px; cursor: pointer; font-size: 12px; border-radius: 3px; display: none; }
    
    /* 관리자 글쓰기 패널 */
    #adminPanel { display: none; background: #f9f9f9; padding: 20px; border-bottom: 1px solid #eee; }
    #adminPanel input, #adminPanel textarea, #adminPanel select { width: 100%; margin-bottom: 10px; padding: 8px; box-sizing: border-box; border: 1px solid #ddd; }
    #adminPanel textarea { height: 150px; resize: none; }
    #submitPost { width: 100%; padding: 10px; background-color: #000; color: #fff; border: none; cursor: pointer; }
    
    /* 글 상세 보기 및 이미지 스타일 */
    .back-btn { background: none; border: 1px solid #000; padding: 5px 15px; cursor: pointer; margin-bottom: 20px; }
    #detailTitle { font-size: 24px; margin: 10px 0; }
    #detailContent { line-height: 1.6; white-space: pre-wrap; }
    .detail-img { max-width: 100%; height: auto; margin: 15px 0; display: block; border-radius: 5px; }
  </style>
</head>
<body>

  <div id="theme-wrapper">

    <header>
      <h1 onclick="goHome()" style="cursor:pointer;">ONZEN</h1>
      <button class="gear-btn" id="settingsBtn">⚙️</button>
    </header>

    <div id="settingsModal">
      <div class="setting-item">
        <label>밝기 조절</label>
        <input type="range" id="brightness" min="40" max="100" value="100" style="width: 100%;">
      </div>
      <div class="setting-item">
        <label>글씨 크기</label>
        <input type="range" id="fontSize" min="14" max="26" value="16" style="width: 100%;">
      </div>
      <div class="admin-login" id="adminAuthArea">
        <p style="margin: 0 0 5px 0; font-weight: bold;">관리자 로그인</p>
        <input type="text" id="adminId" placeholder="이메일 입력">
        <input type="password" id="adminPw" placeholder="비밀번호 입력">
        <button id="loginBtn" style="width: 100%;">로그인</button>
      </div>
    </div>

    <div id="adminPanel">
      <h3>새 글 작성 (관리자 전용)</h3>
      <select id="postCategory">
        <option value="TECH">TECH</option>
        <option value="LIFE">LIFE</option>
      </select>
      <input type="text" id="postTitle" placeholder="제목을 입력하세요">
      <input type="text" id="postImgUrl" placeholder="사진 이미지 링크 주소를 입력하세요 (선택)">
      <textarea id="postContent" placeholder="내용을 입력하세요"></textarea>
      <button id="submitPost">발행하기</button>
    </div>

    <nav id="menuNav">
      <button onclick="filterPosts('ALL')" id="btn-ALL" class="active">ALL</button>
      <button onclick="filterPosts('TECH')" id="btn-TECH">TECH</button>
      <button onclick="filterPosts('LIFE')" id="btn-LIFE">LIFE</button>
    </nav>

    <div class="sort-nav" id="sortNav">
      <button onclick="changeSort('latest')" id="sort-latest" class="active">최신순</button>
      <button onclick="changeSort('popular')" id="sort-popular">인기순</button>
      <button onclick="changeSort('date')" id="sort-date">날짜순</button>
    </div>

    <main id="postListContainer">
      <p style="text-align: center; color: #888;">글을 불러오는 중입니다...</p>
    </main>

    <article id="postDetailContainer" style="display: none;">
      <button class="back-btn" onclick="goHome()">← 목록으로</button>
      <div id="detailCategory" class="post-category"></div>
      <h2 id="detailTitle"></h2>
      <div style="font-size: 12px; color: #888; margin-bottom: 15px;" id="detailViews"></div>
      <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
      <div id="detailImgArea"></div>
      <p id="detailContent"></p>
    </article>

  </div> <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, orderBy, increment, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCvTBZ_eVwJiur9AStVWKHqPRX5BcblVVU",
      authDomain: "onzen-cff46.firebaseapp.com",
      projectId: "onzen-cff46",
      storageBucket: "onzen-cff46.firebasestorage.app",
      messagingSenderId: "882959909282",
      appId: "1:882959909282:web:f2bb42a967ca893c3d32fb",
      measurementId: "G-R9NC6X661K"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let allPosts = [];
    let currentCategory = 'ALL';
    let currentSort = 'latest'; 
    let isLoggedIn = false; 

    const settingsBtn = document.getElementById('settingsBtn');
    const settingsModal = document.getElementById('settingsModal');
    const brightness = document.getElementById('brightness');
    const fontSize = document.getElementById('fontSize');
    const loginBtn = document.getElementById('loginBtn');
    const adminPanel = document.getElementById('adminPanel');
    const adminAuthArea = document.getElementById('adminAuthArea');
    const themeWrapper = document.getElementById('theme-wrapper');

    // 설정 UI 제어
    settingsBtn.addEventListener('click', () => {
      settingsModal.style.display = settingsModal.style.display === 'block' ? 'none' : 'block';
    });
    brightness.addEventListener('input', (e) => {
      themeWrapper.style.filter = `brightness(${e.target.value}%)`;
    });
    fontSize.addEventListener('input', (e) => {
      themeWrapper.style.fontSize = `${e.target.value}px`;
    });

    // 로그인
    loginBtn.addEventListener('click', () => {
      const email = document.getElementById('adminId').value;
      const pw = document.getElementById('adminPw').value;
      signInWithEmailAndPassword(auth, email, pw)
        .then(() => { alert('관리자 로그인 성공!'); settingsModal.style.display = 'none'; })
        .catch((error) => { alert('아이디 또는 비밀번호가 틀렸습니다.'); });
    });

    // 상태 체크
    onAuthStateChanged(auth, (user) => {
      if (user) {
        isLoggedIn = true;
        adminPanel.style.display = 'block';
        adminAuthArea.innerHTML = `
          <p style="margin:0 0 5px 0; color:blue; font-weight:bold;">관리자 모드 활성화</p>
          <button id="logoutBtn" style="width:100%; padding:5px; background:#ff4a5a; color:#fff; border:none; cursor:pointer;">로그아웃</button>
        `;
        document.getElementById('logoutBtn').addEventListener('click', () => {
          signOut(auth).then(() => { alert('로그아웃 되었습니다.'); location.reload(); });
        });
      } else {
        isLoggedIn = false;
        adminPanel.style.display = 'none';
      }
      renderPosts(); 
    });

    // 글쓰기 기능
    document.getElementById('submitPost').addEventListener('click', async () => {
      const title = document.getElementById('postTitle').value;
      const content = document.getElementById('postContent').value;
      const category = document.getElementById('postCategory').value;
      const imgUrl = document.getElementById('postImgUrl').value;

      if (!title || !content) { alert('제목과 내용을 모두 입력해 주세요.'); return; }

      try {
        await addDoc(collection(db, "posts"), {
          title: title,
          content: content,
          category: category,
          imgUrl: imgUrl || "",
          createdAt: Date.now(),
          views: 0 
        });
        
        alert('글이 성공적으로 발행되었습니다!');
        document.getElementById('postTitle').value = '';
        document.getElementById('postContent').value = '';
        document.getElementById('postImgUrl').value = '';
        loadPosts();
      } catch (e) {
        alert('글 발행 중 오류가 발생했습니다.');
      }
    });

    // 삭제
    window.deletePost = async function(id, event) {
      event.stopPropagation(); 
      if(!confirm("정말로 이 글을 삭제하시겠습니까?")) return;
      try {
        await deleteDoc(doc(db, "posts", id));
        alert("글이 삭제되었습니다.");
        loadPosts(); 
      } catch (error) {
        alert("글 삭제 중 오류가 발생했습니다.");
      }
    };

    // 로드
    async function loadPosts() {
      const container = document.getElementById('postListContainer');
      try {
        const q = query(collection(db, "posts"), orderBy("createdAt", "desc"));
        const querySnapshot = await getDocs(q);
        allPosts = [];
        querySnapshot.forEach((doc) => { allPosts.push({ id: doc.id, ...doc.data() }); });
        renderPosts();
      } catch (error) {
        container.innerHTML = `<p style="color:red; text-align:center;">데이터를 가져오지 못했습니다.</p>`;
      }
    }

    // 그리기
    function renderPosts() {
      const container = document.getElementById('postListContainer');
      container.innerHTML = '';

      let filtered = currentCategory === 'ALL' ? allPosts : allPosts.filter(p => p.category === currentCategory);

      if (currentSort === 'latest') { filtered.sort((a, b) => b.createdAt - a.createdAt); } 
      else if (currentSort === 'date') { filtered.sort((a, b) => a.createdAt - b.createdAt); } 
      else if (currentSort === 'popular') { filtered.sort((a, b) => (b.views || 0) - (a.views || 0)); }

      if (filtered.length === 0) {
        container.innerHTML = '<p style="text-align: center; color: #888; padding: 40px 0;">등록된 게시글이 없습니다.</p>';
        return;
      }

      filtered.forEach(post => {
        const wrapper = document.createElement('div');
        wrapper.className = 'post-item-wrapper';

        const postDiv = document.createElement('div');
        postDiv.className = 'post-item';
        postDiv.innerHTML = `
          <div class="post-info">
            <span class="post-category">${post.category}</span>
            <span>👁️ 조회수 ${post.views || 0}</span>
            ${post.imgUrl ? '<span>🖼️ 사진 포함</span>' : ''}
          </div>
          <h2>${post.title}</h2>
        `;
        postDiv.onclick = () => showPost(post.id);

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'delete-btn';
        deleteBtn.innerText = '삭제';
        deleteBtn.style.display = isLoggedIn ? 'block' : 'none';
        deleteBtn.onclick = (e) => deletePost(post.id, e);

        wrapper.appendChild(postDiv);
        wrapper.appendChild(deleteBtn);
        container.appendChild(wrapper);
      });
    }

    // 정렬 변경
    window.changeSort = function(sortType) {
      currentSort = sortType;
      ['latest', 'popular', 'date'].forEach(type => { document.getElementById(`sort-${type}`).classList.remove('active'); });
      document.getElementById(`sort-${sortType}`).classList.add('active');
      renderPosts();
    };

    // 필터
    window.filterPosts = function(category) {
      currentCategory = category;
      ['ALL', 'TECH', 'LIFE'].forEach(cat => { document.getElementById(`btn-${cat}`).classList.remove('active'); });
      document.getElementById(`btn-${category}`).classList.add('active');
      document.getElementById('postDetailContainer').style.display = 'none';
      document.getElementById('postListContainer').style.display = 'block';
      document.getElementById('menuNav').style.display = 'flex';
      document.getElementById('sortNav').style.display = 'flex'; 
      renderPosts();
    };

    // 상세보기
    window.showPost = async function(id) {
      const post = allPosts.find(p => p.id === id);
      if (!post) return;

      try {
        const postRef = doc(db, "posts", id);
        await updateDoc(postRef, { views: increment(1) });
        post.views = (post.views || 0) + 1; 
      } catch (e) {}

      document.getElementById('postListContainer').style.display = 'none';
      document.getElementById('menuNav').style.display = 'none';
      document.getElementById('adminPanel').style.display = 'none';
      document.getElementById('sortNav').style.display = 'none'; 
      
      const detailContainer = document.getElementById('postDetailContainer');
      detailContainer.style.display = 'block';
      
      document.getElementById('detailCategory').innerText = post.category;
      document.getElementById('detailTitle').innerText = post.title;
      document.getElementById('detailViews').innerText = `조회수 ${post.views}`;
      
      const imgArea = document.getElementById('detailImgArea');
      if(post.imgUrl) {
        imgArea.innerHTML = `<img src="${post.imgUrl}" class="detail-img" alt="본문 이미지">`;
      } else {
        imgArea.innerHTML = ''; 
      }

      document.getElementById('detailContent').innerText = post.content;
    };

    window.goHome = function() { filterPosts('ALL'); };
    loadPosts();
  </script>
</body>
</html>
